<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upcoming events at God Cannot Lie Ministries in Charlotte, North Carolina.">
  <title>Upcoming Events | God Cannot Lie Ministries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#132045;--dark:#0c1730;--gold:#d19f27;--light:#f5f2ec;--muted:#a9b6c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:white;background:radial-gradient(circle at 50% 0,#203969 0,var(--navy) 33%,var(--dark) 75%);font-family:Montserrat,Arial,sans-serif}nav{height:84px;padding:0 clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(209,159,39,.25);background:rgba(12,23,48,.9);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;color:white;text-decoration:none;font-size:12px;line-height:1.35;letter-spacing:1.3px;text-transform:uppercase;font-weight:600}.brand img{width:50px;height:50px;object-fit:contain}.back{color:var(--gold);text-decoration:none;font-size:13px;font-weight:700}main{width:min(1000px,calc(100% - 32px));margin:auto;padding:70px 0 90px}.hero{text-align:center;margin-bottom:38px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:4px;font-size:11px;font-weight:700}h1{margin:12px 0 10px;font:700 clamp(44px,8vw,72px)/.95 "Cormorant Garamond",serif}.intro{color:var(--muted);line-height:1.7}.events{display:grid;gap:34px}.card{overflow:hidden}.card h2{margin:0 0 13px;text-align:center;font:700 clamp(28px,5vw,38px)/1.1 "Cormorant Garamond",serif;color:var(--light)}.flyer-button{display:block;width:100%;padding:0;border:1px solid rgba(209,159,39,.38);border-radius:14px;background:#080e1e;cursor:pointer;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);transition:transform .2s,border-color .2s}.flyer-button:hover,.flyer-button:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}.flyer-button img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.calendar-hint{margin:11px 0 0;text-align:center;color:var(--muted);font-size:12px}.empty{text-align:center;padding:55px 20px;border:1px dashed rgba(209,159,39,.35);border-radius:14px;color:var(--muted)}@media(max-width:600px){nav{height:72px}.brand span{display:none}main{padding:48px 0 80px}.events{gap:28px}.card h2{font-size:29px}.flyer-button{border-radius:9px}}
  </style>
</head>
<body>
  <nav><a class="brand" href="index.html"><img src="gcl-logo.png" alt="GCL Ministries"><span>God Cannot Lie<br>Ministries</span></a><a class="back" href="index.html">← Back to Home</a></nav>
  <main><header class="hero"><div class="eyebrow">Gather With Us</div><h1>Upcoming Events</h1><p class="intro">Save an event to Google Calendar or download it for Apple Calendar.</p></header><section class="events" id="events"><div class="empty">Loading upcoming events…</div></section></main>
  <script type="module">
    import { supabase, EVENT_FLYERS_BUCKET } from './supabase-client.js?v=20260812-events';
    const container = document.getElementById('events');
    const escapeText = (value='') => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const compactUtc = value => new Date(value).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    function googleUrl(event) { const url = new URL('https://calendar.google.com/calendar/render'); url.searchParams.set('action','TEMPLATE'); url.searchParams.set('text',event.title); url.searchParams.set('dates',`${compactUtc(event.starts_at)}/${compactUtc(event.ends_at)}`); url.searchParams.set('details',event.description || 'God Cannot Lie Ministries event'); url.searchParams.set('location',event.location || ''); return url.toString(); }
    function downloadIcs(event) { const clean = value => String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GCL Ministries//Events//EN','BEGIN:VEVENT',`UID:${event.id}@gclministries`,`DTSTAMP:${compactUtc(new Date())}`,`DTSTART:${compactUtc(event.starts_at)}`,`DTEND:${compactUtc(event.ends_at)}`,`SUMMARY:${clean(event.title)}`,`DESCRIPTION:${clean(event.description)}`,`LOCATION:${clean(event.location)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n'); const link=document.createElement('a'); link.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'})); link.download=`${event.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'gcl-event'}.ics`; link.click(); URL.revokeObjectURL(link.href); }
    const { data, error } = await supabase.from('events').select('*').eq('is_published',true).gte('ends_at',new Date().toISOString()).order('starts_at',{ascending:true});
    if (error) { container.innerHTML='<div class="empty">Events could not be loaded right now. Please try again soon.</div>'; console.error(error.message); }
    else if (!data.length) container.innerHTML='<div class="empty"><strong>No upcoming events are posted yet.</strong><br>Check back soon for the next gathering.</div>';
    else { container.replaceChildren(); data.forEach(event => { const card=document.createElement('article'); card.className='card'; const flyer=event.flyer_path?supabase.storage.from(EVENT_FLYERS_BUCKET).getPublicUrl(event.flyer_path).data.publicUrl:''; card.innerHTML=`<h2>${escapeText(event.title)}</h2><button class="flyer-button" type="button" aria-label="Add ${escapeText(event.title)} to calendar">${flyer?`<img src="${escapeText(flyer)}" alt="${escapeText(event.title)} event flyer">`:'<span class="empty">Flyer coming soon</span>'}</button><p class="calendar-hint">Tap the flyer to add this event to your calendar</p>`; card.querySelector('.flyer-button').addEventListener('click',()=>{ if (/Mac|iPhone|iPad|iPod/i.test(navigator.userAgent)) downloadIcs(event); else window.open(googleUrl(event),'_blank','noopener,noreferrer'); }); container.appendChild(card); }); }
  </script>
</body>
</html>
